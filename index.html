<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston House Price AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4f46e5;
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>
    <script type="text/babel">
        const App = () => {
            const [inputs, setInputs] = React.useState({ rm: 6, lstat: 10, ptratio: 18 });
            const [price, setPrice] = React.useState(0);
            const weights = { intercept: 18.3908, rm: 4.4552, lstat: -0.5239, ptratio: -0.9052 };

            React.useEffect(() => {
                const calculatedPrice = weights.intercept + (inputs.rm * weights.rm) + (inputs.lstat * weights.lstat) + (inputs.ptratio * weights.ptratio);
                setPrice(Math.max(0, calculatedPrice));
            }, [inputs]);

            const handleChange = (e) => setInputs({ ...inputs, [e.target.name]: parseFloat(e.target.value) });

            return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col md:flex-row gap-8">
                        <div className="w-full md:w-1/2 space-y-6">
                            <h1 className="text-2xl font-bold text-indigo-600">AI Real Estate</h1>
                            <p className="text-sm text-gray-500">Adjust the factors to predict the home value.</p>
                            <div><label className="block text-sm font-bold mb-1">Rooms ({inputs.rm})</label><input type="range" name="rm" min="3" max="9" step="0.1" value={inputs.rm} onChange={handleChange} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                            <div><label className="block text-sm font-bold mb-1">Lower Status Pop. ({inputs.lstat}%)</label><input type="range" name="lstat" min="1" max="40" step="0.5" value={inputs.lstat} onChange={handleChange} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                            <div><label className="block text-sm font-bold mb-1">Student-Teacher Ratio ({inputs.ptratio})</label><input type="range" name="ptratio" min="12" max="22" step="0.5" value={inputs.ptratio} onChange={handleChange} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                        </div>
                        <div className="w-full md:w-1/2 bg-indigo-600 rounded-xl text-white flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                            <div className="z-10"><p className="uppercase tracking-widest text-xs opacity-75 mb-2">Estimated Value</p><h2 className="text-5xl font-bold">${price.toFixed(2)}k</h2><p className="text-xs opacity-50 mt-4">Based on Historical Boston Data</p></div>
                            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-indigo-500 to-indigo-800 opacity-50"></div>
                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
